name: Regenerate Contract Bindings

on:
  workflow_dispatch:
    inputs:
      bindings:
        description: "Optional space-separated binding names (e.g. 'exchange-router test-token'). Leave empty to regenerate everything in packages/contracts/contracts.json."
        required: false
        type: string

# Read-only by default; the regen job opts in to the write scopes it needs.
permissions:
  contents: read

jobs:
  regen:
    name: Regenerate and PR
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      # workflow_dispatch inputs are user-controlled — never interpolate them
      # directly into a `run:` script. Expose the value as an environment
      # variable instead; shell variable expansion never re-parses the value
      # for metacharacters, so `x; curl …` reaches the command as plain text.
      BINDINGS: ${{ github.event.inputs.bindings }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      # The official Stellar CLI ships as a native binary, not an npm package.
      # This action derives the version to download from its own ref by
      # default, so when it is pinned to an immutable commit SHA the release
      # version has to be passed explicitly (a branch ref like @main would
      # otherwise resolve to a nonexistent "vmain" download).
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: v27.1.0

      - name: Validate bindings input
        run: |
          if [[ ! "$BINDINGS" =~ ^[a-z0-9 -]*$ ]]; then
            echo "::error::Invalid 'bindings' input: only lowercase letters, digits, spaces and hyphens are allowed."
            exit 1
          fi

      # Contract IDs live in packages/contracts/contracts.json, so no secrets
      # or environment wiring are needed here.
      - name: Generate Bindings
        run: bun run contracts:gen:all $BINDINGS

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerate contract bindings"
          branch: chore/regen-contract-bindings
          title: "chore: regenerate contract bindings"
          body: |
            Regenerated contract bindings from the IDs committed in
            `packages/contracts/contracts.json`.

            Requested bindings: `${{ env.BINDINGS || 'all' }}`

            > [!WARNING]
            > The committed bindings carry hand-written adaptations (camelCase
            > fields and extra `*Args` / `*Val` helpers) that `src/clients`
            > depends on. A raw regeneration overwrites them, so check the diff
            > and typecheck before merging.

            This pull request was automatically generated by the `contracts-regen.yml` workflow.
          labels: |
            automated-pr
            dependencies
