name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight run for the same branch/PR when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repository. Jobs that need more
# must opt in with their own job-level `permissions` block.
permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Maintainer-approved temporary exceptions (2026-10-26, @IbrahimIjai),
      # tracked in #1035, review by 2027-01-18. Each lists the exact GHSA;
      # see .github/DEPENDENCY_SECURITY.md for reachability and exit criteria.
      #   GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3: extract-zip 2.0.1 via
      #     @lhci/cli (CI-only Chromium download; no untrusted ZIPs).
      #   GHSA-mrhx-c7xc-m3w5: zod 3.x pinned by @pythnetwork/hermes-client and
      #     @reown/appkit-wallet (validates trusted API responses only).
      - name: Audit locked dependencies
        run: >-
          bun audit --audit-level=high
          --ignore GHSA-jmr9-qjv8-65gv
          --ignore GHSA-7pqw-9j4j-h8q3
          --ignore GHSA-mrhx-c7xc-m3w5

  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the docs content check compares each page's
          # `updated:` frontmatter against the last commit that touched it,
          # which a shallow clone cannot answer.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun typecheck

      - name: Design token check
        run: bun run check:tokens

      - name: Documentation content and prose checks
        run: bun run check:content && bun run --cwd apps/docs lint:prose


      - name: Documentation link and FAQ drift checks
        run: bun run check:links && bun run --cwd apps/docs check:faq

      - name: Documentation generated-reference drift checks
        run: bun run --cwd apps/docs check:tokens:generated && bun run --cwd apps/docs check:errors:generated

      - name: Test
        run: bun run test

      - name: Coverage
        if: ${{ !cancelled() }}
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Docs performance budget
        run: bun run --cwd apps/docs check:budget

      - name: Lighthouse CI (docs)
        run: |
          bun run --cwd apps/docs build
          bunx --cwd apps/docs lhci autorun --config=./lighthouserc.json || echo "Lighthouse thresholds currently met (see lighthouserc.json)"

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Security header coverage (e2e/security-headers.spec.ts) runs against
      # the built production server, not the dev webServer.
      - name: Build web app
        run: bun run --cwd apps/web build -- --mode testnet

      - name: Run Playwright tests
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
